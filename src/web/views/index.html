<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoManga Tools</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>

    <!-- CONFIRM MODAL -->
    <div id="confirm-modal" class="fade-in">
        <div class="modal-box">
            <div id="confirm-msg" class="modal-msg">¿Proceder con la acción solicitada?</div>
            <div class="modal-btns">
                <button class="btn-yes" onclick="resolveConfirm(true)">✅ Sí, continuar</button>
                <button class="btn-no" onclick="resolveConfirm(false)">❌ No por ahora</button>
                <button class="btn-yes-all" onclick="resolveConfirm('yes_all')">⚡ Confirmar para TODO</button>
                <button class="btn-no-all" onclick="resolveConfirm('no_all')">🛑 Cancelar TODO</button>
            </div>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box fade-in">
            <h2 style="background: none; -webkit-text-fill-color: #fff;">NeoManga</h2>
            <p style="color: var(--text-muted); margin-bottom: 24px; font-weight: 500;">Tools & Management Suite</p>
            <input type="email" id="email" class="login-input" placeholder="Correo electrónico" required>
            <input type="password" id="password" class="login-input" placeholder="Contraseña" required>
            <button class="login-btn" onclick="login()">Acceder al Sistema</button>
            <div id="login-error" class="error-msg" style="color: var(--error-color); margin-top: 15px; font-weight: 700; font-size: 0.9rem; display: none;">Error: Credenciales no válidas</div>
        </div>
    </div>

    <!-- APP LAYOUT -->
    <div id="app-layout">
        <div class="sidebar">
            <div class="logo">
                <img src="/public/logo-header.png" alt="Logo">
            </div>
            
            <nav>
                <button class="nav-btn active" onclick="setMode('upload')">
                    <span style="font-size: 1.4rem;">☁️</span> Upload Center
                </button>
                <button class="nav-btn" onclick="setMode('verify')">
                    <span style="font-size: 1.4rem;">🔍</span> Verificación
                </button>
                <button class="nav-btn" onclick="setMode('repair')">
                    <span style="font-size: 1.4rem;">🔧</span> Reparación
                </button>
                <button class="nav-btn" onclick="setMode('create')">
                    <span style="font-size: 1.4rem;">➕</span> Crear Serie
                </button>
            </nav>
            
            <div class="config-section">
                <span class="config-label">Ruta de Origen</span>
                <span class="config-value" id="current-folder">Cargando directorio...</span>
                <button class="btn-small" id="change-folder-btn" onclick="promptChangeFolder()">Cambiar Directorio</button>
            </div>
            
            <div class="user-info">
                <div>
                    <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Sesión de</div>
                    <div id="user-display" style="font-weight: 800; color: #fff;">Usuario</div>
                </div>
                <button onclick="logout()" style="background:rgba(239, 68, 68, 0.1); border:none; color:var(--error-color); cursor:pointer; padding: 8px 12px; border-radius: 10px; font-weight:700;">Salir</button>
            </div>
        </div>

        <div class="main fade-in">
            <div class="header">
                <div class="page-logo">
                    <h2 id="page-title">Upload Center</h2>
                </div>
                <div style="display: flex; gap: 16px; align-items: center;">
                    <button id="reset-btn" class="btn-secondary" onclick="resetUI()" style="padding: 10px 20px;">🏠 Inicio</button>
                    <div id="status-indicator" style="display:none">
                        <div class="spinner"></div>
                        <span>SISTEMA ACTIVO</span>
                    </div>
                </div>
            </div>

            <div class="controls-card" id="standard-controls">
                <select id="series-select">
                    <option value="" disabled selected>Cargando catálogo local...</option>
                </select>
                <div class="action-btns">
                    <button id="action-btn" onclick="runAction()">Lanzar Proceso</button>
                    <button class="btn-secondary" onclick="clearTerm()">Limpiar Consola</button>
                </div>
            </div>

            <!-- CREATE SERIES FORM -->
            <div id="create-series-section" class="controls-card" style="display: none; flex-direction: column; gap: 24px; align-items: stretch;">
                <h3 style="margin: 0; color: var(--accent-color); font-size: 1.2rem;">Nueva Serie</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label class="config-label">Título de la Serie</label>
                        <input type="text" id="create-title" class="login-input" placeholder="Ej: One Piece" oninput="updateSlug()">
                    </div>
                    <div class="form-group">
                        <label class="config-label">ID de la Serie (Slug)</label>
                        <input type="text" id="create-slug" class="login-input" placeholder="one-piece" disabled style="opacity: 0.6; cursor: not-allowed;">
                    </div>
                    <div class="form-group">
                        <label class="config-label">Tipo de Serie</label>
                        <select id="create-type" style="width: 100%;">
                            <option value="Manga">Manga</option>
                            <option value="Manhwa">Manhwa</option>
                            <option value="Manhua">Manhua</option>
                            <option value="Novel">Novela</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="config-label">Estado</label>
                        <select id="create-status" style="width: 100%;">
                            <option value="Ongoing">Publicándose</option>
                            <option value="Completed">Finalizado</option>
                            <option value="Hiatus">En Pausa</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="config-label">Autor</label>
                        <input type="text" id="create-author" class="login-input" placeholder="Ej: Eiichiro Oda">
                    </div>
                    <div class="form-group">
                        <label class="config-label">Año de Lanzamiento</label>
                        <input type="number" id="create-year" class="login-input" placeholder="Ej: 1997">
                    </div>
                </div>

                <div class="form-group">
                    <label class="config-label">Géneros</label>
                    <div id="genres-container" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; max-height: 120px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 12px;">
                        <!-- Genres will be loaded here -->
                        <span style="color: var(--text-muted); font-size: 0.8rem;">Cargando géneros...</span>
                    </div>
                    <input type="text" id="new-genre" class="login-input" placeholder="Agregar nuevo género (Enter)" style="margin-bottom: 0;">
                </div>

                <div class="form-group">
                    <label class="config-label">Descripción</label>
                    <textarea id="create-description" class="login-input" style="height: 100px; resize: none; font-family: inherit;" placeholder="Sinopsis de la serie..."></textarea>
                </div>

                <div class="form-group">
                    <label class="config-label">Portada (URL o Archivo)</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="text" id="create-cover-url" class="login-input" placeholder="https://ejemplo.com/imagen.jpg" style="flex: 1; margin-bottom: 0;">
                        <label for="create-cover-file" class="btn-secondary" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                            📁 Subir Archivo
                            <input type="file" id="create-cover-file" style="display: none;" accept="image/*" onchange="handleFileSelect(event)">
                        </label>
                    </div>
                    <div id="file-name-display" style="font-size: 0.8rem; color: var(--success-color); margin-top: 8px; display: none;"></div>
                </div>

                <div style="display: flex; gap: 16px; margin-top: 10px;">
                    <button id="create-btn" onclick="submitCreateSeries()" style="flex: 2; padding: 16px; background: var(--accent-gradient); border: none; border-radius: 16px; color: #fff; font-weight: 800; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 12px var(--accent-glow);">Crear Serie en Base de Datos</button>
                    <button class="btn-secondary" onclick="resetCreateForm()" style="flex: 1;">Cancelar</button>
                </div>
            </div>

            <div class="terminal-container">
                <div class="terminal-header">
                    <div style="display: flex; gap: 8px;">
                        <div class="dot red"></div>
                        <div class="dot yellow"></div>
                        <div class="dot green"></div>
                    </div>
                    <span style="margin-left: auto; font-size: 0.7rem; color: var(--text-muted); font-weight: 800; letter-spacing: 0.1em;">TERMINAL OUTPUT V2.8</span>
                </div>
                <div class="terminal" id="terminal">
                    <div class="log-line log-info">Consola inicializada correctamente.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket-lib.js"></script>
    <script src="/public/js/client.js"></script>
</body>
</html>
